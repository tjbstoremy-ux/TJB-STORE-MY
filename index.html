<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TJB STORE MY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.header {
  text-align: center;
  padding: 45px 20px;
  background: #1e293b;
}

.header h1 {
  font-size: 40px;
  margin: 0;
}

.header p {
  font-size: 18px;
}

.container {
  width: 90%;
  max-width: 550px;
  margin: 25px auto;
}

.card {
  background: white;
  color: #111827;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 18px;
}

.card h2 {
  margin-top: 0;
}

.package {
  width: 100%;
  padding: 18px;
  margin: 8px 0;
  background: #f8fafc;
  border: 2px solid #cbd5e1;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.package:hover {
  border-color: #111827;
}

input {
  width: 100%;
  padding: 16px;
  margin: 7px 0;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
}

.topup {
  width: 100%;
  padding: 17px;
  margin-top: 12px;
  background: #111827;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.selected {
  margin-top: 15px;
  font-weight: bold;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="header">
  <h1>TJB STORE MY</h1>
  <p>Mobile Legends Diamond Top Up</p>
</div>

<div class="container">

  <div class="card">
    <h2>💎 PILIH DIAMOND</h2>

    <button class="package" onclick="selectPackage(this, '86 Diamond', 6)">
      💎 86 Diamond — RM6
    </button>

    <button class="package" onclick="selectPackage(this, '172 Diamond', 12)">
      💎 172 Diamond — RM12
    </button>

    <button class="package" onclick="selectPackage(this, '257 Diamond', 18)">
      💎 257 Diamond — RM18
    </button>

    <button class="package" onclick="selectPackage(this, '355 Diamond', 28)">
      💎 355 Diamond — RM28
    </button>

    <p id="selected" class="selected">
      Belum pilih diamond
    </p>
  </div>

  <div class="card">
    <h2>👤 MAKLUMAT PLAYER</h2>

    <input type="text" id="userID" placeholder="Masukkan User ID">

    <input type="text" id="serverID" placeholder="Masukkan Server ID">

    <button class="topup" onclick="makeOrder()">
      TOP UP SEKARANG
    </button>
  </div>

</div>

<script>

let selectedDiamond = "";
let selectedPrice = 0;

function selectPackage(button, diamond, price) {

  document.querySelectorAll(".package").forEach(function(btn) {
    btn.style.borderColor = "#cbd5e1";
  });

  button.style.borderColor = "#111827";

  selectedDiamond = diamond;
  selectedPrice = price;

  document.getElementById("selected").innerText =
    "Dipilih: " + diamond + " — RM" + price;
}

function makeOrder() {

  const userID = document.getElementById("userID").value;
  const serverID = document.getElementById("serverID").value;

  if (selectedDiamond === "") {
    alert("Sila pilih diamond dahulu.");
    return;
  }

  if (userID === "" || serverID === "") {
    alert("Sila masukkan User ID dan Server ID.");
    return;
  }

  alert(
    "Order diterima!\n\n" +
    "Package: " + selectedDiamond + "\n" +
    "Harga: RM" + selectedPrice + "\n" +
    "User ID: " + userID + "\n" +
    "Server ID: " + serverID
  );
}

</script>

</body>
</html>>
