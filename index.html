<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TJB STORE MY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #07111f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    /* BANNER */

    .banner {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin-bottom: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 30px;
      margin: 5px 0;
    }

    .header p {
      color: #aab7c8;
    }

    /* CARD */

    .card {
      background: #101d2e;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    /* DIAMOND */

    .packages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .package {
      background: #182940;
      color: white;
      border: 2px solid transparent;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .package:hover {
      border-color: #1683ff;
    }

    .package.selected {
      border-color: #1683ff;
      background: #203b5c;
    }

    #selected {
      color: #7fc1ff;
      font-weight: bold;
      margin-top: 15px;
    }

    /* INPUT */

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #1b2b40;
      color: white;
      font-size: 15px;
      outline: none;
    }

    /* QR */

    .qr {
      width: 250px;
      max-width: 100%;
      display: block;
      margin: 15px auto;
      background: white;
      padding: 8px;
      border-radius: 15px;
    }

    .note {
      color: #aab7c8;
      font-size: 13px;
      line-height: 1.5;
    }

    /* BUTTON */

    .pay-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #1683ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .pay-btn:hover {
      background: #0d6ed5;
    }

    footer {
      text-align: center;
      color: #718096;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>


<body>

<div class="container">


  <!-- ===================== -->
  <!-- BANNER -->
  <!-- ===================== -->

  <img
    src="https://i.postimg.cc/bJn9tn1h/cfd4f2dba4e03392a4701de07b45d33a.jpg"
    class="banner"
    alt="TJB Store MY">


  <!-- ===================== -->
  <!-- HEADER -->
  <!-- ===================== -->

  <div class="header">

    <h1>🔥 TJB STORE MY</h1>

    <p>
      Mobile Legends Diamond Top Up
    </p>

  </div>


  <!-- ===================== -->
  <!-- PILIH DIAMOND -->
  <!-- ===================== -->

  <div class="card">

    <h2>💎 Pilih Diamond</h2>


    <div class="packages">


      <button
        class="package"
        onclick="selectPackage(this, '86 Diamond', 6)">

        💎 86 Diamond
        <br>
        RM6

      </button>


      <button
        class="package"
        onclick="selectPackage(this, '172 Diamond', 12)">

        💎 172 Diamond
        <br>
        RM12

      </button>


      <button
        class="package"
        onclick="selectPackage(this, '257 Diamond', 18)">

        💎 257 Diamond
        <br>
        RM18

      </button>


      <button
        class="package"
        onclick="selectPackage(this, '355 Diamond', 24.98)">

        💎 355 Diamond
        <br>
        RM24.98

      </button>


    </div>


    <p id="selected">
      Belum pilih pakej
    </p>

  </div>


  <!-- ===================== -->
  <!-- PLAYER INFO -->
  <!-- ===================== -->

  <div class="card">

    <h2>🎮 Maklumat Player</h2>


    <input
      type="text"
      id="userId"
      placeholder="Masukkan User ID">


    <input
      type="text"
      id="serverId"
      placeholder="Masukkan Server ID">

  </div>


  <!-- ===================== -->
  <!-- PAYMENT -->
  <!-- ===================== -->

  <div class="card">

    <h2>💳 Pembayaran</h2>


    <p>
      Scan QR di bawah untuk membuat pembayaran.
    </p>


    <!-- QR KAU -->

    <a
      href="https://i.postimg.cc/g2jQQMvn/1790922003669.jpg"
      target="_blank">

      <img
        src="https://i.postimg.cc/g2jQQMvn/1790922003669.jpg"
        class="qr"
        alt="Payment QR">

    </a>


    <p class="note">

      Selepas membuat pembayaran,
      tekan butang <b>SAYA SUDAH BAYAR</b>.

      <br><br>

      Pastikan pembayaran benar-benar berjaya.

    </p>


    <button
      class="pay-btn"
      onclick="makeOrder()">

      📲 SAYA SUDAH BAYAR

    </button>

  </div>


  <footer>

    © 2026 TJB STORE MY

  </footer>


</div>


<script>


/* ========================= */
/* PEMILIHAN DIAMOND */
/* ========================= */


let selectedPackage = "";

let selectedPrice = 0;


function selectPackage(button, packageName, price) {


  document
    .querySelectorAll(".package")
    .forEach(btn =>
      btn.classList.remove("selected")
    );


  button.classList.add("selected");


  selectedPackage = packageName;

  selectedPrice = price;


  document.getElementById("selected").innerText =

    "Dipilih: " +
    packageName +
    " — RM" +
    price.toFixed(2);

}



/* ========================= */
/* WHATSAPP ORDER */
/* ========================= */


function makeOrder() {


  const userId =
    document
      .getElementById("userId")
      .value
      .trim();


  const serverId =
    document
      .getElementById("serverId")
      .value
      .trim();



  /* CHECK DIAMOND */


  if (!selectedPackage) {

    alert(
      "Sila pilih diamond dahulu."
    );

    return;
  }



  /* CHECK USER ID */


  if (!userId) {

    alert(
      "Sila masukkan User ID."
    );

    return;
  }



  /* CHECK SERVER ID */


  if (!serverId) {

    alert(
      "Sila masukkan Server ID."
    );

    return;
  }



  /* ======================= */
  /* WHATSAPP NUMBER */
  /* ======================= */

  /*
  TUKAR NOMBOR INI
  KEPADA WHATSAPP KAU.

  Contoh:

  0123456789

  menjadi:

  60123456789

  */


  const whatsappNumber =
    "601153575022";



  /* ======================= */
  /* ORDER MESSAGE */
  /* ======================= */


  const message =

    "🛒 ORDER TJB STORE MY\n\n" +

    "💎 Diamond: " +
    selectedPackage +
    "\n" +

    "💰 Harga: RM" +
    selectedPrice.toFixed(2) +
    "\n\n" +

    "🎮 User ID: " +
    userId +
    "\n" +

    "🌐 Server ID: " +
    serverId +
    "\n\n" +

    "✅ Saya sudah membuat pembayaran.";



  /* ======================= */
  /* OPEN WHATSAPP */
  /* ======================= */


  const whatsappURL =

    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}

</script>

</body>
</html>
