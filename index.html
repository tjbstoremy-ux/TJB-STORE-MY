<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJB STORE MY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .banner {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 5px 0;
    }

    .header p {
      color: #aab7c8;
    }

    .card {
      background: #101d2e;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    .packages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .package {
      background: #182940;
      color: white;
      border: 2px solid transparent;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
    }

    .package.selected {
      border-color: #1683ff;
      background: #203b5c;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #1b2b40;
      color: white;
    }

    #selected {
      color: #7fc1ff;
      font-weight: bold;
    }

    .qr {
      width: 250px;
      max-width: 100%;
      display: block;
      margin: 15px auto;
      background: white;
      padding: 8px;
      border-radius: 15px;
    }

    .pay-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #1683ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      color: #aab7c8;
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: #718096;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <!-- BANNER -->
    <img
      src="BANNER_URL_KAU"
      class="banner"
      alt="TJB Store Banner">

    <h1>TJB STORE MY</h1>
    <p>Mobile Legends Diamond Top Up</p>

  </div>


  <!-- PILIH DIAMOND -->
  <div class="card">

    <h2>💎 Pilih Diamond</h2>

    <div class="packages">

      <button class="package"
        onclick="selectPackage(this, '86 Diamond', 6)">
        💎 86 Diamond<br>RM6
      </button>

      <button class="package"
        onclick="selectPackage(this, '172 Diamond', 12)">
        💎 172 Diamond<br>RM12
      </button>

      <button class="package"
        onclick="selectPackage(this, '257 Diamond', 18)">
        💎 257 Diamond<br>RM18
      </button>

      <button class="package"
        onclick="selectPackage(this, '355 Diamond', 24.98)">
        💎 355 Diamond<br>RM24.98
      </button>

    </div>

    <p id="selected">Belum pilih pakej</p>

  </div>


  <!-- PLAYER -->
  <div class="card">

    <h2>🎮 Maklumat Player</h2>

    <input
      type="text"
      id="userId"
      placeholder="User ID">

    <input
      type="text"
      id="serverId"
      placeholder="Server ID">

  </div>


  <!-- QR PAYMENT -->
  <div class="card">

    <h2>💳 Pembayaran</h2>

    <p>Scan QR di bawah untuk membuat pembayaran.</p>

    <a href="https://i.postimg.cc/g2jQQMvn/1790922003669.jpg" target="_blank">

      <img
        src="https://i.postimg.cc/g2jQQMvn/1790922003669.jpg"
        class="qr"
        alt="Payment QR">

    </a>

    <p class="note">
      Selepas pembayaran, tekan butang di bawah.
    </p>

    <button class="pay-btn" onclick="makeOrder()">
      SAYA SUDAH BAYAR
    </button>

  </div>


  <footer>
    © 2026 TJB STORE MY
  </footer>

</div>


<script>

let selectedPackage = "";
let selectedPrice = 0;

function selectPackage(button, packageName, price) {

  document.querySelectorAll(".package")
    .forEach(btn => btn.classList.remove("selected"));

  button.classList.add("selected");

  selectedPackage = packageName;
  selectedPrice = price;

  document.getElementById("selected").innerText =
    "Dipilih: " + packageName +
    " — RM" + price.toFixed(2);
}

function makeOrder() {

  const userId =
    document.getElementById("userId").value.trim();

  const serverId =
    document.getElementById("serverId").value.trim();

  if (!selectedPackage) {
    alert("Sila pilih diamond dahulu.");
    return;
  }

  if (!userId || !serverId) {
    alert("Sila masukkan User ID dan Server ID.");
    return;
  }

  alert(
    "Pesanan diterima!\n\n" +
    "Pakej: " + selectedPackage + "\n" +
    "Harga: RM" + selectedPrice.toFixed(2) + "\n" +
    "User ID: " + userId + "\n" +
    "Server ID: " + serverId
  );
}

</script>

</body>
</html>
