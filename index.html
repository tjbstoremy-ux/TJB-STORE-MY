<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TJB STORE MY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #07111f;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    /* BANNER */

    .banner {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      margin-bottom: 20px;
    }

    /* HEADER */

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 30px;
      margin: 5px 0;
    }

    .header p {
      color: #aab7c8;
    }

    /* CARD */

    .card {
      background: #101d2e;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    /* PACKAGES */

    .packages {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .package {
      background: #182940;
      color: white;
      border: 2px solid transparent;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
      transition: 0.2s;
    }

    .package:hover {
      border-color: #1683ff;
      transform: translateY(-2px);
    }

    .package.selected {
      border-color: #1683ff;
      background: #203b5c;
    }

    .bonus {
      color: #ffd43b;
      font-size: 13px;
      font-weight: bold;
    }

    #selected {
      color: #7fc1ff;
      font-weight: bold;
      margin-top: 15px;
    }

    /* INPUT */

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #1b2b40;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #8796aa;
    }

    /* QR */

    .qr {
      width: 250px;
      max-width: 100%;
      display: block;
      margin: 15px auto;
      background: white;
      padding: 8px;
      border-radius: 15px;
    }

    .note {
      color: #aab7c8;
      font-size: 13px;
      line-height: 1.5;
    }

    /* BUTTON */

    .pay-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #1683ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .pay-btn:hover {
      background: #0d6ed5;
    }

    /* FOOTER */

    footer {
      text-align: center;
      color: #718096;
      font-size: 13px;
      margin-top: 25px;
    }
